body{font-family:Manrope,"Segoe UI",system-ui,sans-serif;background:var(--porcelain);color:var(--ink)}
.hero{position:relative;height:100vh;min-height:620px;overflow:hidden;color:#fff}

.copy{position:absolute;z-index:2;left:clamp(20px,4vw,56px);bottom:clamp(48px,12vh,120px);max-width:560px}
.kicker{font-size:11px;letter-spacing:.2em;text-transform:uppercase;opacity:.85;margin-bottom:22px}
h1{font-weight:300;font-size:clamp(40px,6vw,92px);line-height:1.02;letter-spacing:-.02em}
p{margin-top:22px;font-size:15px;line-height:1.7;max-width:380px;opacity:.9;font-weight:300}
.btn{display:inline-block;margin-top:34px;border:1px solid rgba(255,255,255,.7);padding:14px 26px;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:#fff;text-decoration:none}
.scroll{position:absolute;z-index:2;right:clamp(20px,4vw,56px);bottom:48px;font-size:10px;letter-spacing:.2em;text-transform:uppercase;writing-mode:vertical-rl}
.cap{position:absolute;z-index:2;left:clamp(20px,4vw,56px);bottom:20px;font-size:10px;letter-spacing:.14em;text-transform:uppercase;opacity:.7}
